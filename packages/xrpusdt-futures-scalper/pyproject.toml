[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xrp-scalper"
version = "0.1.0"
description = "Dry-run-first Binance USD-M futures XRPUSDT scalper scaffold"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.2.2",
  "websockets==12.0"
]

[project.scripts]
xrp-scalper = "xrp_scalper.bot:main"

[tool.setuptools.packages.find]
where = ["src"]
