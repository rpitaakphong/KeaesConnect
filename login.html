<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Keaes Workspace</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/portal.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="assets/js/supabase-config.js"></script>
  <script defer src="assets/js/keaes-api.js"></script>
  <script defer src="assets/js/portal.js"></script>
  <script async src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body data-page="login">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-nav">
    <a class="brand-mark" href="dashboard.html" aria-label="Keaes Workspace dashboard"><img src="assets/brand/keaes-workspace-logo.png" alt="Keaes Workspace"></a>
    <nav aria-label="Primary navigation"></nav>
    <div class="nav-actions">
      <span data-employee-badge class="badge soft hidden">Employee</span>
      <a data-login-link class="ghost-button is-active" href="login.html">Log in</a>
      <button data-logout-button class="ghost-button hidden" type="button">Log out</button>
    </div>
  </header>

  <main id="main" class="app-shell">
    <section class="login-layout" aria-labelledby="loginTitle">
      <article class="login-copy">
        <p class="eyebrow">Employee access</p>
        <h1 id="loginTitle">Welcome to Keaes Workspace.</h1>
        <p>Staff access is handled by Supabase Auth. Use an approved staff account to continue.</p>
      </article>
      <form id="loginForm" class="login-card">
        <h2>Log in</h2>
        <label>Email
          <input id="employeeEmail" type="email" autocomplete="email" placeholder="name@keaes.com" required>
        </label>
        <label>Password
          <input id="employeePassword" type="password" autocomplete="current-password" placeholder="Staff password" required>
        </label>
        <div id="loginError" class="notice error hidden" role="alert"></div>
        <button class="primary-button" type="submit"><i data-lucide="log-in"></i> Continue to Dashboard</button>
        <p class="support-note">If login is unavailable, add your Supabase URL and anon key in the workspace config.</p>
      </form>
    </section>
  </main>
</body>
</html>
