<!doctype html>
<!-- Legacy fallback: replaced by Next.js at /admin/staff. Keep until one full production verification cycle is complete. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Staff Management | Keaes Workspace</title>
  <link rel="stylesheet" href="../../assets/css/base.css?v=shared-theme">
  <link rel="stylesheet" href="../../assets/css/portal.css?v=shared-theme">
  <link rel="stylesheet" href="styles.css?v=staff-access">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../../assets/js/supabase-config.js"></script>
  <script defer src="../../assets/js/keaes-api.js"></script>
  <script defer src="../../assets/js/portal.js?v=shared-header-paths"></script>
  <script defer src="staff.js?v=staff-access"></script>
</head>
<body data-page="staff-management">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div data-portal-header></div>

  <main id="main" class="admin-shell">
    <section class="hero-panel">
      <div>
        <p class="eyebrow">Super Admin</p>
        <h1>Manage staff access.</h1>
        <p>Create staff accounts, assign admin level, and choose which admin features each Staff user can access.</p>
      </div>
      <div class="backend-badge" data-staff-status>Permission mode</div>
    </section>

    <section class="admin-grid">
      <article class="panel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Create account</p>
            <h2>New staff user</h2>
          </div>
        </div>
        <form class="staff-form" data-create-staff-form>
          <label>Email
            <input name="email" type="email" autocomplete="email" required>
          </label>
          <label>Display name
            <input name="displayName" autocomplete="name" required>
          </label>
          <label>Temporary password
            <input name="temporaryPassword" type="text" minlength="8" required>
          </label>
          <label>Admin level
            <select name="role" data-role-select>
              <option value="staff">Staff</option>
              <option value="super_admin">Super Admin</option>
            </select>
          </label>
          <fieldset class="permission-fieldset" data-permission-fieldset>
            <legend>Staff permissions</legend>
            <div class="permission-grid" data-create-permissions></div>
          </fieldset>
          <button class="primary-button" type="submit">Create staff user</button>
          <p class="support-note" data-create-staff-message></p>
        </form>
      </article>

      <article class="panel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Staff directory</p>
            <h2>Access controls</h2>
          </div>
          <button class="ghost-button" type="button" data-refresh-staff>Refresh</button>
        </div>
        <div class="staff-list" data-staff-list></div>
      </article>
    </section>
  </main>
</body>
</html>
