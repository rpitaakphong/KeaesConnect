<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Literacy Level 1 - Student Details</title>
  <link rel="stylesheet" href="styles.css?v=starter-theme-match">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../../../assets/js/supabase-config.js"></script>
  <script defer src="../../../assets/js/keaes-api.js"></script>
  <script defer src="landing.js?v=demo-preview"></script>
</head>
<body class="landing-page">
  <a class="skip-link" href="#studentDetails">Skip to student details</a>

  <main id="studentDetails" class="landing-shell">
    <section class="student-gate" data-student-gate aria-labelledby="studentGateTitle">
      <div class="student-gate-card">
        <div>
          <p class="eyebrow">English Literacy Level 1</p>
          <h1 id="studentGateTitle">Enter your information before starting.</h1>
          <p class="hint" data-assignment-status>Your details will be attached to your submitted score for admin review.</p>
        </div>
        <form class="student-form" data-student-form>
          <div class="fixed-field">
            <span>Subject</span>
            <strong>English</strong>
            <input name="subject" type="hidden" value="English">
          </div>
          <div class="fixed-field">
            <span>Level</span>
            <strong>English Literacy 1</strong>
            <input name="level" type="hidden" value="English Literacy 1">
          </div>
          <label>Full name <input name="fullName" autocomplete="name" required></label>
          <label>Nickname <input name="nickname" autocomplete="nickname" required></label>
          <label>Date of birth <input name="dateOfBirth" type="date" required></label>
          <label>Test date <input name="testDate" type="date" required></label>
          <button class="primary-action" type="submit" data-student-submit disabled>Continue to test</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
