<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Literacy Level 5</title>
  <link rel="stylesheet" href="../../../assets/css/base.css?v=shared-theme">
  <link rel="stylesheet" href="../../../assets/css/test-theme.css?v=shared-theme">
  <link rel="stylesheet" href="styles.css?v=shared-theme">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../../../assets/js/supabase-config.js"></script>
  <script defer src="../../../assets/js/keaes-api.js"></script>
  <script defer src="app.js?v=level-5-ai-split"></script>
</head>
<body>
  <a class="skip-link" href="#test">Skip to test</a>

  <header class="exam-header">
    <div class="exam-title">
      <p class="eyebrow">English Literacy 5</p>
      <h1>Assessment Test</h1>
      <p data-student-line>Loading student details...</p>
    </div>
    <div class="header-actions">
      <span class="status-pill"><span data-progress-count>0</span>/30 answered</span>
      <button class="primary-action" type="button" data-submit>Submit test</button>
    </div>
  </header>

  <main id="test" class="shell">
    <aside class="part-nav" aria-label="Test parts" data-part-nav></aside>
    <section class="test-panel" data-test-panel></section>
  </main>

  <dialog class="confirm-dialog" data-submit-dialog aria-labelledby="submitDialogTitle">
    <form method="dialog">
      <h2 id="submitDialogTitle">Submit test now?</h2>
      <p>Blank answers will be marked incorrect. You cannot change answers after submission.</p>
      <div class="dialog-actions">
        <button class="secondary-action" type="submit" value="cancel">Cancel</button>
        <button class="primary-action" type="submit" value="confirm">Submit test</button>
      </div>
    </form>
  </dialog>
</body>
</html>
