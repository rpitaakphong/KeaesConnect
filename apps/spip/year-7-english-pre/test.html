<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPIP Year 7 English Pre-test</title>
  <link rel="stylesheet" href="../../../assets/css/base.css?v=shared-theme">
  <link rel="stylesheet" href="../../../assets/css/test-theme.css?v=shared-theme">
  <link rel="stylesheet" href="styles.css?v=spip-y7-english-pre">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../../../assets/js/supabase-config.js"></script>
  <script defer src="../../../assets/js/keaes-api.js"></script>
  <script defer src="config.js?v=spip-y7-english-pre"></script>
  <script defer src="app.js?v=spip-y7-english-pre"></script>
</head>
<body>
  <a class="skip-link" href="#test">Skip to test</a>
  <header class="exam-header">
    <div>
      <p class="eyebrow">SPIP Year 7 English</p>
      <h1>Pre-test</h1>
      <p class="test-meta" data-test-meta>Loading student details...</p>
    </div>
    <section class="audio-bar" aria-label="Listening exam audio">
      <div>
        <p class="eyebrow">Listening audio</p>
        <h2>Official audio pending</h2>
      </div>
      <button class="start-exam-button" type="button" data-start-audio disabled>Start listening exam</button>
      <audio preload="none" data-audio-player data-audio-src="">
        Your browser does not support the audio element.
      </audio>
      <div class="audio-tools">
        <span class="time-readout" data-audio-time>Audio not uploaded</span>
        <p class="audio-note is-warning" data-audio-status>Listening questions are included but not scored until the official audio and key are verified.</p>
      </div>
    </section>
    <div class="answer-status">
      <strong><span data-progress-count>0</span>/46 answered</strong>
      <button class="primary-action compact-submit" type="button" data-submit-test>Submit test</button>
    </div>
  </header>
  <main id="test" class="shell">
    <aside class="part-nav" aria-label="Test sections" data-part-nav></aside>
    <section class="test-panel" data-test-panel></section>
  </main>
</body>
</html>
