<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPIP Year 7 Math Pre-test</title>
  <link rel="stylesheet" href="../../../assets/css/base.css?v=shared-theme">
  <link rel="stylesheet" href="../../../assets/css/test-theme.css?v=shared-theme">
  <link rel="stylesheet" href="styles.css?v=spip-y7-math-pre">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../../../assets/js/supabase-config.js"></script>
  <script defer src="../../../assets/js/keaes-api.js"></script>
  <script defer src="config.js?v=spip-y7-math-pre"></script>
  <script defer src="landing.js?v=spip-y7-math-pre-local-demo"></script>
</head>
<body class="student-entry-page">
  <main class="student-entry-shell">
    <section class="student-gate" aria-labelledby="student-gate-title">
      <div class="student-gate-copy">
        <p class="eyebrow">SPIP Year 7 Math Pre-test</p>
        <h1 id="student-gate-title">Enter your information before starting.</h1>
        <p data-assignment-status>Your details will be attached to your submitted score for admin review.</p>
      </div>
      <form class="student-form" data-student-form>
        <div class="fixed-field">
          <span>Subject</span>
          <strong>Math</strong>
          <input type="hidden" name="subject" value="Math">
        </div>
        <div class="fixed-field">
          <span>Level</span>
          <strong>SPIP Year 7</strong>
          <input type="hidden" name="level" value="SPIP Year 7">
        </div>
        <label>
          <span>Full name</span>
          <input name="fullName" autocomplete="name" required>
        </label>
        <label>
          <span>Nickname</span>
          <input name="nickname" autocomplete="nickname" required>
        </label>
        <label>
          <span>Date of birth</span>
          <input name="dateOfBirth" type="date" required>
        </label>
        <label>
          <span>Test date</span>
          <input name="testDate" type="date" required>
        </label>
        <button class="primary-action" type="submit" data-student-submit disabled>Continue to test</button>
      </form>
    </section>
  </main>
</body>
</html>
