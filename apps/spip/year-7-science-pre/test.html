<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPIP Year 7 Science Pre-test</title>
  <link rel="stylesheet" href="../../../assets/css/base.css?v=shared-theme">
  <link rel="stylesheet" href="../../../assets/css/test-theme.css?v=shared-theme">
  <link rel="stylesheet" href="styles.css?v=spip-y7-science-pre-q5-figure-size">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../../../assets/js/supabase-config.js"></script>
  <script defer src="../../../assets/js/keaes-api.js"></script>
  <script defer src="config.js?v=spip-y7-science-pre-q5-figure-size"></script>
  <script defer src="app.js?v=spip-y7-science-pre-q5-figure-size"></script>
</head>
<body>
  <a class="skip-link" href="#test">Skip to test</a>
  <header class="exam-header">
    <div>
      <p class="eyebrow">SPIP Year 7 Science</p>
      <h1>Pre-test</h1>
      <p class="test-meta" data-test-meta>Loading student details...</p>
    </div>
    <div class="paper-note">
      <p class="eyebrow">Science Paper</p>
      <strong>16 questions · 50 marks · 45 minutes</strong>
      <span>Figures and answers are based on the supplied SPIP Year 7 Science paper.</span>
    </div>
    <div class="answer-status">
      <strong><span data-progress-count>0</span>/<span data-question-count>0</span> answered</strong>
      <button class="primary-action compact-submit" type="button" data-submit-test>Submit test</button>
    </div>
  </header>
  <main id="test" class="shell">
    <aside class="part-nav" aria-label="Test sections" data-part-nav></aside>
    <section class="test-panel" data-test-panel></section>
  </main>
</body>
</html>
