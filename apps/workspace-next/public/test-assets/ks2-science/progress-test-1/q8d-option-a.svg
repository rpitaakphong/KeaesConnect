<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">Option 1: candle height over time</title>
  <desc id="desc">The new candle starts at 10 cm and falls steadily to 1 cm at 20 minutes. Candle C falls from 10 cm to 1 cm at 35 minutes. The horizontal axis runs from 0 to 40 minutes; the vertical axis runs from 0 to 12 cm.</desc>
  <rect width="400" height="440" rx="8" fill="#fff"/>
  <g font-family="Arial, sans-serif" font-size="22" fill="#263445">
    <path d="M56 22 H102" fill="none" stroke="#263445" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
    <text x="116" y="29">Candle C</text>
    <path d="M56 52 H102" fill="none" stroke="#0072ce" stroke-width="8" stroke-linecap="round"/>
    <text x="116" y="59">New candle</text>
    <text x="56" y="88">Height (cm)</text>
  </g>
  <g stroke="#e1e7ed" stroke-width="1">
    <path d="M56 100 V364"/>
    <path d="M96 100 V364"/>
    <path d="M136 100 V364"/>
    <path d="M176 100 V364"/>
    <path d="M216 100 V364"/>
    <path d="M256 100 V364"/>
    <path d="M296 100 V364"/>
    <path d="M336 100 V364"/>
    <path d="M376 100 V364"/>
    <path d="M56 364 H376"/>
    <path d="M56 342 H376"/>
    <path d="M56 320 H376"/>
    <path d="M56 298 H376"/>
    <path d="M56 276 H376"/>
    <path d="M56 254 H376"/>
    <path d="M56 232 H376"/>
    <path d="M56 210 H376"/>
    <path d="M56 188 H376"/>
    <path d="M56 166 H376"/>
    <path d="M56 144 H376"/>
    <path d="M56 122 H376"/>
    <path d="M56 100 H376"/>
  </g>
  <path d="M56 100 V364 H376" fill="none" stroke="#263445" stroke-width="2"/>
  <g fill="#263445" font-family="Arial, sans-serif" font-size="22" text-anchor="end">
    <text x="44" y="371">0</text>
    <text x="44" y="349">1</text>
    <text x="44" y="327">2</text>
    <text x="44" y="283">4</text>
    <text x="44" y="239">6</text>
    <text x="44" y="195">8</text>
    <text x="44" y="151">10</text>
    <text x="44" y="107">12</text>
  </g>
  <g fill="#263445" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">
    <text x="56" y="394">0</text>
    <text x="136" y="394">10</text>
    <text x="216" y="394">20</text>
    <text x="296" y="394">30</text>
    <text x="376" y="394">40</text>
    <text x="216" y="428">Time (minutes)</text>
  </g>
  <!-- Draw the wider prediction first so both styles remain visible when the lines coincide. -->
  <path d="M56 144 L216 342" fill="none" stroke="#0072ce" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M56 144 L336 342" fill="none" stroke="#263445" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
</svg>
